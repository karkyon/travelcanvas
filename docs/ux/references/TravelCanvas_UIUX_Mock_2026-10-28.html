-pills{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.category-pills button{border:1px solid var(--line);border-radius:999px;background:#fff;padding:7px 10px;font-weight:700;font-size:11px;color:#59647a}.category-pills button.active{background:var(--indigo);border-color:var(--indigo);color:#fff}.discover-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.discover-card{overflow:hidden}.discover-photo{height:125px;position:relative;background:#e9e5d5}.discover-photo svg{height:100%;width:100%}.discover-copy{padding:12px}.discover-copy h3{font-size:13px;margin:0 0 4px}.discover-copy small{font-size:10px;color:var(--muted)}.social-import{padding:15px}.social-import .source-row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.social-preview{padding:11px;background:#f7f6ff;border-radius:12px;margin-top:11px;font-size:11px}.photo-source{position:absolute;bottom:7px;left:7px;background:#ffffffdf;border-radius:7px;padding:4px 7px;font-size:9px;font-weight:800;color:#4e596b}.photo-tune{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.photo-tune button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 8px;font-weight:700;font-size:10px}
    @media(max-width:1180px){.planner-layout{grid-template-columns:minmax(280px,.9fr) minmax(0,1.3fr)}.detail-card{grid-column:1/-1;min-height:0;display:grid;grid-template-columns:140px 1fr auto;gap:12px;align-items:center}.detail-art{height:96px;margin:0}.detail-card .label{grid-column:2}.detail-card h3{grid-column:2}.detail-card p{grid-column:2}.detail-card .detail-actions{grid-column:3;grid-row:1/4}.detail-facts{display:none}.map-first .planner-layout{grid-template-columns:minmax(280px,.8fr) minmax(0,1.2fr)}.map-first .detail-card{grid-column:1/-1}.stats{grid-template-columns:repeat(2,1fr)}}

etail-card .detail-actions{grid-column:auto;grid-row:auto}.detail-facts{display:grid}.editorial .detail-card{display:block}.editorial .detail-art{width:100%;height:118px}.map-toolbar{left:9px;right:9px;top:9px}.map-chip{padding:7px 8px;font-size:10px}.map-legend{left:9px;bottom:9px}.live-hero{padding:17px}.live-hero h2{font-size:19px}.now-card{padding:16px}.now-card h3{font-size:18px}.now-card .big-time{font-size:31px}.trip-timeline{margin-top:12px}.field-grid{grid-template-columns:1fr}.quick-form{padding:16px}.quick-preview{padding:15px}.compare-grid{grid-template-columns:1fr}.compare-route{height:130px}.share-settings{padding:16px}.guest-preview{padding:8px}.guest-cover{height:120px}.guest-copy{padding:12px}.guest-copy h3{font-size:17px}.memory-hero{grid-template-columns:1fr}.memory-art{min-height:172px}.memory-copy{padding:17px}.memory-copy h2{font-size:21px}.memory-grid{grid-template-columns:1fr 1fr;gap:10px}.memory-photo{height:112px}.memory-card:nth-child(3){display:none}.memory-actions{flex-wrap:wrap}.mobile-only{display:inline-flex}}

<body>
  <div class="app" id="app" data-theme="atlas">
    <header class="topbar">
      <div class="brand"><span class="brandmark">✦</span><span>TravelCanvas</span></div>
      <button class="trip-switch" aria-label="旅行を切り替える"><span>🗾</span><span class="trip-name">京都、秋色をめぐる旅<small>11月14日 — 16日 · 4人</small></span><span class="chev">⌄</span></button>
      <span class="demo-chip">UIモック · サンプルデータ</span><div class="top-spacer"></div>
      <div class="theme-control" aria-label="UI案を切り替える">
        <button class="theme-button active" data-theme-choice="atlas">Atlas</button><button class="theme-button" data-theme-choice="editorial">Editorial</button><button class="theme-button" data-theme-choice="daylight">Daylight</button><button class="theme-button" data-theme-choice="studio">Studio</button>
      </div><button class="avatar" aria-label="プロフィール">K</button>
    </header>
    <div class="shell">
      <nav class="rail" aria-label="TravelCanvas画面">
        <button data-screen="home" class="active"><span class="icon">⌂</span>ホーム</button>
        <button data-screen="plan"><span class="icon">◷</span>旅程</button>
        <button data-screen="discover"><span class="icon">⌕</span>発見</button>
        <button data-screen="today"><span class="icon">◉</span>今日</button>
        <button data-screen="resources"><span class="icon">▣</span>旅行箱</button>
        <button data-screen="share"><span class="icon">↗</span>共有</button>
        <button data-screen="memory"><span class="icon">▧</span>記録</button>
        <button data-screen="quick"><span class="icon">＋</span>クイック</button>
        <button data-screen="optimize"><span class="icon">⌁</span>比較</button>
        <button class="rail-bottom" data-screen="home"><span class="icon">⚙</span>設定</button>
      </nav>
      <main class="main" id="main"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const state={screen:'home',theme:'atlas',day:0,selected:0,optimized:false,applied:false,revealed:false,done:false,sharePreview:false,showSecrets:false,resourceTab:'reservations',added:[],planView:'day',timezoneExample:false,photoChoice:0,discoverCategory:'すべて',socialImported:false,dragIndex:null};
    const screens={home:['ダッシュボード','/dashboard'],plan:['プランナー','/planner/kyoto-demo'],discover:['近くを発見 · 情報取込','/search + /planner/kyoto-demo/candidates'],today:['今日／NOW-NEXT','/planner/kyoto-demo/today'],resources:['旅行箱 · 予約・準備','/planner/kyoto-demo/reservations + /preparation'],quick:['Quick Plan','/planner'],optimize:['最適化比較','/optimization'],share:['共有プレビュー','/share/kyoto-demo'],memory:['旅の記録','/planner/kyoto-demo/memories']};
    const days=[['11/14 土','東山を歩く'],['11/15 日','嵐山と川沿い'],['11/16 月','最後の寄り道']];
    const baseEvents=[
      [{time:'09:30',title:'清水寺',meta:'滞在 90分 · 拝観',badge:'確認済',kind:'blue'},{time:'11:45',title:'錦市場で昼ごはん',meta:'徒歩 18分 · 60分',badge:'候補あり',kind:''},{time:'14:00',title:'京都文化博物館',meta:'バス 22分 · 75分',badge:'チケット',kind:'good'},{time:'16:10',title:'祇園・白川',meta:'徒歩 14分 · 60分',badge:'余裕あり',kind:'good'},{time:'18:00',title:'夕食 · 先斗町',meta:'徒歩 12分 · 予約あり',badge:'予約',kind:'warn'}],
      [{time:'09:15',title:'渡月橋',meta:'宿から 35分 · 30分',badge:'確認済',kind:'blue'},{time:'10:00',title:'嵐山竹林の小径',meta:'徒歩 12分 · 60分',badge:'候補あり',kind:''},{time:'12:00',title:'嵯峨野で昼食',meta:'徒歩 8分 · 60分',badge:'予約',kind:'warn'},{time:'14:00',title:'天龍寺',meta:'徒歩 5分 · 75分',badge:'チケット',kind:'good'}],
      [{time:'10:00',title:'京都御所',meta:'地下鉄 18分 · 90分',badge:'確認済',kind:'blue'},{time:'12:00',title:'出町ふたば',meta:'徒歩 10分 · 25分',badge:'候補あり',kind:''},{time:'14:00',title:'京都駅へ移動',meta:'地下鉄 20分',badge:'移動',kind:'good'}]
    ];
    const events=()=>{const a=baseEvents[state.day].map(x=>({...x}));return state.added.length?a.concat(state.added):a};
    const iconMap=`<svg viewBox="0 0 900 650" preserveAspectRatio="none" aria-label="京都の街並みと旅行ルート"><rect width="900" height="650" fill="#e8efe7"/><path d="M0 118C160 156 260 65 420 109S690 156 900 74M0 402C154 363 287 445 444 394S719 359 900 429" fill="none" stroke="#d3e0d7" stroke-width="53"/><path d="M-15 215C170 252 340 182 480 220S735 245 920 170M62 0C90 168 32 277 115 650M340 0C284 175 400 322 343 650M670 0C725 155 629 346 740 650" fill="none" stroke="#f9fbf8" stroke-width="17"/><path d="M210 455C300 404 358 352 424 326S555 252 627 205S699 161 752 133" fill="none" stroke="#627b6d" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 3"/><path d="M181 194l102-27 44 27-27 56-113-1zM472 445l93-23 30 42-46 45-95-21zM700 380l97-29 44 37-32 57-109-8z" fill="#d4decf"/><g fill="#b1c3ae"><circle cx="224" cy="104" r="34"/><circle cx="306" cy="316" r="25"/><circle cx="560" cy="165" r="36"/><circle cx="424" cy="518" r="26"/><circle cx="828" cy="239" r="30"/></g><text x="48" y="82" fill="#657569" font-size="17" letter-spacing="4">KYOTO · HIGASHIYAMA</text><text x="533" y="548" fill="#718076" font-size="15" letter-spacing="2">鴨川</text></svg>`;
    const landscape=`<svg viewBox="0 0 700 260" preserveAspectRatio="xMidYMid slice" aria-label="京都の山並みのイラスト"><rect width="700" height="260" fill="#d9e8db"/><circle cx="565" cy="55" r="28" fill="#f3c98b"/><path d="M0 205 145 88l84 73L352 49l155 155 77-90 116 107v39H0z" fill="#8eaa8e"/><path d="M0 230 170 141l125 70 147-79 117 92 92-80 49 41v75H0z" fill="#688c75"/><path d="M0 230c140-32 190-6 298 9s210-25 402 8v13H0z" fill="#c2d0b3"/><path d="M544 193V120h39v73m-49-73 29-35 29 35m-44 18h29m-29 16h29" stroke="#a94e42" stroke-width="7" fill="none"/><g fill="#466e59"><circle cx="93" cy="171" r="24"/><circle cx="633" cy="170" r="27"/><circle cx="407" cy="177" r="21"/></g></svg>`;
    const photoSVG=(variant=0)=>variant===0?`<svg viewBox="0 0 400 190" preserveAspectRatio="xMidYMid slice"><rect width="400" height="190" fill="#dbbca4"/><path d="M0 139 90 65l68 63 83-80 159 101v41H0z" fill="#9f8874"/><path d="M0 157 89 117l64 32 83-31 164 36v36H0z" fill="#5f7560"/><circle cx="303" cy="48" r="22" fill="#f2d8a2"/><path d="M197 162v-54h27v54m-34-54 20-24 20 24m-31 12h25m-25 12h25" stroke="#b74e3a" stroke-width="5" fill="none"/></svg>`:variant===1?`<svg viewBox="0 0 400 190" preserveAspectRatio="xMidYMid slice"><rect width="400" height="190" fill="#d4e3dc"/><path d="M0 120C100 90 170 153 240 119S340 100 400 128v62H0z" fill="#7aa4a0"/><path d="M0 146c90-28 160 28 245 0s118-20 155-8v52H0z" fill="#496b70"/><path d="M62 20v130m0-110h75m-75 30h75m-75 30h75" stroke="#f4eee4" stroke-width="9"/><circle cx="297" cy="47" r="25" fill="#f5d79a"/></svg>`:`<svg viewBox="0 0 400 190" preserveAspectRatio="xMidYMid slice"><rect width="400" height="190" fill="#e7d3c5"/><path d="M0 155 69 102l65 23 77-69 88 70 41-27 60 56v35H0z" fill="#a97861"/><path d="M0 168c100-30 156 5 236-7s126-28 164-7v36H0z" fill="#665c52"/><path d="M240 164V87h40v77m-49-77 29-34 29 34m-44 17h31m-31 17h31" stroke="#f1e4d2" stroke-width="6" fill="none"/></svg>`;
    const noteText={atlas:'旅の全体像を地図からつかみ、寄り道の発見を日程へつなぐ案。ホーム・旅程を中心に、計画から記憶まで同じ地図が育ちます。',editorial:'行き先への期待をつくる写真と編集記事型の案。候補箱・旅行一覧で「行きたい」を集め、選んだら既存のプランナーへ渡します。',daylight:'旅行中の判断を最短にする案。今日の画面でNOW/NEXT、出発期限、予約・チケット・ナビを片手で扱います。',studio:'地図を主役にする編集案。プランナーの3ペインと変更前プレビューを軸に、詳細パネルだけに軽いガラス表現を使います。'};
    function note(){return `<div class="pattern-note"><i class="pattern-dot"></i><span><b>${({atlas:'Journey Atlas',editorial:'Travel Editorial',daylight:'Daylight Companion',studio:'Map Studio'})[state.theme]}</b> — ${noteText[state.theme]}</span></div>`}
    function pageHead(kicker,title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="subhead">${sub}</p></div>${action}</div>`}
    function eventRows(){return events().map((e,i)=>`<div class="event-row ${state.selected===i?'selected':''}" role="button" tabindex="0" onclick="selectEvent(${i})" onkeydown="if(event.key==='Enter')selectEvent(${i})"><div class="event-time">${e.time}</div><div class="event-dot"></div><div class="event-info"><b>${e.title}</b><small>${e.meta}</small><div class="event-meta"><span class="pill ${e.kind}">${e.badge}</span>${i===0?'<span class="pill">同行 4人</span>':''}</div></div></div>`).join('')}
    function mapHTML(){return `<div class="route-map">${iconMap}<div class="map-toolbar"><span class="map-chip">⌖ ${days[state.day][1]} · MAP</span><button class="map-chip" onclick="toast('地図を拡大しました')">＋　−</button></div><span class="map-center-label">KYOTO CITY</span>${events().slice(0,4).map((e,i)=>`<button class="pin ${state.selected===i?'selected':''}" style="left:${18+i*19}%;top:${68-i*14}%;" aria-label="${e.title}" onclick="selectEvent(${i})"><span>${i+1}</span></button>`).join('')}<div class="map-legend"><span class="pill blue">● 予定</span><span class="pill good">✓ 確認済</span><span class="pill">☆ 候補</span></div></div>`}
    function selectedEvent(){return events()[Math.min(state.selected,events().length-1)]||{time:'09:30',title:'清水寺',meta:'滞在 90分',badge:'確認済'}}
    function detailHTML(){const e=selectedEvent();return `<aside class="card detail-card"><div class="detail-art">${landscape}</div><div><div class="label">選択中の予定 · DAY ${String(state.day+1).padStart(2,'0')}</div><h3>${e.title}</h3><p>京都市東山区 · ${e.time}から${e.meta.split('·')[0].trim()}</p></div><div class="detail-actions"><button class="btn sm" onclick="toast('地図アプリを開く操作を体験中です')">↗ 地図</button><button class="btn sm" onclick="toast('予約・チケットの詳細を開きます')">▣ 予約</button><button class="btn sm" onclick="toast('同行者へ連絡する操作です')">☏ 連絡</button><button class="btn sm" onclick="toast('予定の詳細を表示しました')">詳細</button></div><div class="detail-facts"><span><b>移動</b><small>徒歩 18分 · 1.2km</small></span><span><b>情報</b><small>確認済 · 10/26 16:10</small></span><span><b>保存</b><small>同期済み · 端末でも閲覧可</small></span></div></aside>`}
    function planner(){return `${pageHead('PLAN · SC-06','旅程を組み立てる','地図と日程は同じ場所データで連動。カードを選ぶと地図と詳細が一緒に切り替わります。',state.applied?`<button class="btn" onclick="undoOptimize()">↶ 変更を戻す</button>`:`<button class="btn primary" onclick="go('quick')">＋ 予定を追加</button>`)}${note()}${state.applied?'<div class="comparison-callout" style="margin-bottom:14px"><b>提案ルートを適用しました。</b> 変更前の旅程に戻すこともできます。</div>':''}<div class="planner-layout ${state.theme==='atlas'||state.theme==='studio'?'map-first':''}"><section class="card timeline-card"><div class="section-row"><div><div class="label">KYOTO · DAY ${state.day+1}</div><h2 class="section-title">${days[state.day][1]}</h2></div><button class="mini-link" onclick="go('optimize')">ルートを見る　↗</button></div><div class="day-tabs">${days.map((d,i)=>`<button class="day-tab ${state.day===i?'active':''}" onclick="setDay(${i})">${d[0]}</button>`).join('')}</div><div>${eventRows()}</div><button class="btn sm" style="width:100%;margin-top:5px" onclick="go('quick')">＋ 日程に追加する</button></section>${mapHTML()}${detailHTML()}</div>`}
    function home(){const a=pageHead('YOUR JOURNEY','次の旅を、楽しみに変える','日程も予約も、旅の準備も。この旅のページから一緒に進められます。',`<button class="btn primary" onclick="go('quick')">＋ 旅行をつくる</button>`);return `${a}${note()}<section class="hero"><div class="hero-art">${landscape}</div><div class="hero-copy"><div class="eyebrow">NEXT JOURNEY · 18日後</div><h2>京都、秋色をめぐる旅</h2><p>東山の朝から、嵐山の夕暮れまで。気になった場所が、少しずつ旅のかたちになっています。</p><div class="hero-badges"><span class="pill">11月14日 — 16日</span><span class="pill">京都 · 3日間</span><span class="pill">4人で計画中</span></div><div class="hero-actions"><button class="btn primary" onclick="go('plan')">旅程をひらく　→</button><button class="btn" onclick="go('today')">今日の準備を見る</button></div></div></section><div class="stats"><div class="card stat"><strong>12<span style="font-size:12px">スポット</span></strong><small>予定 8 · 候補 4</small></div><div class="card stat"><strong>68%</strong><small>準備チェック</small></div><div class="card stat"><strong>2<span style="font-size:12px">件</span></strong><small>みんなで決めたい</small></div><div class="card stat"><strong>3<span style="font-size:12px">日</span></strong><small>旅程の日数</small></div></div><div class="grid dashboard-grid"><div class="grid"><section class="card" style="padding:17px"><div class="section-row"><h2 class="section-title">旅のつづき</h2><button class="mini-link" onclick="go('plan')">旅程を編集 →</button></div><div class="trip-card" style="padding:14px 0 0"><div class="trip-thumb"></div><div class="trip-copy"><h3>京都、秋色をめぐる旅</h3><p>11/14 — 11/16 · 京都 · 4人</p><div class="trip-line"><i></i></div></div><button class="btn sm" onclick="go('plan')">ひらく</button></div></section><section class="card focus-list"><div class="section-row"><h2 class="section-title">次に決めること</h2><span class="pill warn">2件</span></div><div class="focus-row"><div class="focus-icon">◉</div><div><b>昼食の候補をみんなで選ぶ</b><small>錦市場 · 投票あと2人</small></div><button class="mini-link" onclick="go('plan')">見る</button></div><div class="focus-row"><div class="focus-icon">▣</div><div><b>嵐山の移動方法を決める</b><small>電車とバスを比較できます</small></div><button class="mini-link" onclick="go('optimize')">比較</button></div></section></div><section class="card focus-list"><div class="section-row"><h2 class="section-title">旅のハイライト</h2><span class="pill good">準備中</span></div><div class="focus-row"><div class="focus-icon">⌖</div><div><b>地図と日程がつながる</b><small>8件の予定 · 4つの候補</small></div></div><div class="focus-row"><div class="focus-icon">▦</div><div><b>予約は予定からすぐ確認</b><small>予約番号とQRは本人だけに表示</small></div></div><div class="focus-row"><div class="focus-icon">↗</div><div><b>同行者に共有</b><small>見せる情報をプレビューできます</small></div></div><button class="btn" style="width:100%;margin-top:8px" onclick="go('share')">共有プレビューを確認</button></section></div>`}
    function today(){const e=state.done?{time:'11:10',title:'錦市場で昼ごはん',meta:'徒歩 18分 · 60分'}:{time:'09:30',title:'清水寺',meta:'滞在 90分 · 拝観'};const next=state.done?{time:'14:00',title:'京都文化博物館',meta:'バス 22分 · 75分'}:{time:'11:45',title:'錦市場で昼ごはん',meta:'徒歩 18分 · 60分'};return `${pageHead('LIVE · SC-07','今日の旅を、迷わず進む','11月14日（土） · 京都時間 09:12 · 接続中 · 最終同期 09:10',`<button class="btn sm" onclick="toast('最新情報を確認しました')">↻ 更新</button>`)}${note()}<section class="live-hero"><div class="live-top"><div><div class="eyebrow">SATURDAY · KYOTO</div><h2>東山を歩く一日</h2><p>晴れ 18°　 ·　 4人　 ·　 今日の予定 5件</p></div><span class="pill" style="background:#ffffff20;color:white">● 同期済</span></div></section><div class="grid live-grid"><div class="grid"><section class="card now-card"><div class="label">NOW · ${state.done?'次の予定へ':'いま向かう'}</div><div class="big-time">${e.time}</div><h3>${e.title}</h3><p>${e.meta} · 京都市東山区 · ${state.done?'出発まで 21分':'到着予定 09:28'}</p><span class="pill live">● まもなく開始</span><div class="now-actions"><button class="btn coral" onclick="toast('ナビを開く操作を体験中です')">↗ ナビを開始</button><button class="btn" onclick="state.done=true;render();toast('到着を記録しました')">✓ 到着</button><button class="btn" onclick="go('plan')">予定の詳細</button></div></section><section class="card now-card next"><div class="label">NEXT · 次に向かう場所</div><h3>${next.title}</h3><p>${next.time} · ${next.meta}</p><div class="ticket-lock"><span>▣ 入場チケット　•••• 4821</span><button class="btn sm" onclick="revealTicket()">表示する</button></div>${state.revealed?'<div class="ticket-reveal">DEMO · 4821</div><small class="muted">サンプル表示。実際のQR・予約情報ではありません。</small>':''}</section></div><section class="card focus-list"><div class="section-row"><h2 class="section-title">今日の旅程</h2><span class="pill">5件</span></div>${baseEvents[0].map((x,i)=>`<div class="timeline-small"><time>${x.time}</time><span><b>${x.title}</b><br><small class="muted">${x.meta}</small></span><span class="pill ${x.kind}">${x.badge}</span></div>`).join('')}<div class="focus-row"><div class="focus-icon">ⓘ</div><div><b>雨や遅れがあれば</b><small>候補から代替を探せます</small></div><button class="mini-link" onclick="go('optimize')">代替案</button></div></section></div><section class="card trip-timeline"><div class="section-row"><h2 class="section-title">旅の操作をひとつに</h2><span class="pill blue">片手で届く</span></div><div class="now-actions"><button class="btn sm" onclick="toast('電話をかける操作を体験中です')">☏ 施設へ電話</button><button class="btn sm" onclick="go('share')">↗ 同行者へ</button><button class="btn sm" onclick="toast('旅行情報をオフラインでも見る画面です')">↓ 保存済み情報</button></div></section>`}
    function quick(){return `${pageHead('QUICK PLAN · SC-33','まず、行きたい気持ちから','目的地と日付だけで保存。時刻や予約はあとから追加できます。',`<button class="btn sm" onclick="go('plan')">旅程へ戻る</button>`)}${note()}<div class="grid quick-layout"><form class="card quick-form" onsubmit="saveQuick(event)"><div class="section-row"><h2 class="section-title">旅行の基本</h2><span class="pill blue">1 / 2 · かんたん入力</span></div><div class="field"><label for="title">旅行の名前</label><input id="title" value="京都、秋色をめぐる旅" required /></div><div class="field-grid"><div class="field"><label for="destination">行き先</label><input id="destination" value="京都" placeholder="例：金沢" /></div><div class="field"><label for="people">誰と行く？</label><select id="people"><option>家族・友人 4人</option><option>ひとり旅</option><option>あとで決める</option></select></div></div><div class="field-grid"><div class="field"><label for="start">出発日</label><input id="start" type="date" value="2026-11-14" /></div><div class="field"><label for="end">帰着日</label><input id="end" type="date" value="2026-11-16" /></div></div><div class="field"><label for="first">最初に行きたい場所（任意）</label><input id="first" value="清水寺" placeholder="気になる場所をひとつ" /><small class="field-help">場所がまだ決まらなくても旅行を作れます。</small></div><div class="field"><label for="memo">旅のテーマ（任意）</label><textarea id="memo" placeholder="例：紅葉とおいしいものを楽しみたい"></textarea></div><button class="btn primary" type="submit">この旅を保存して旅程へ　→</button></form><aside class="card quick-preview"><div class="label">旅行カード · プレビュー</div><div class="preview-card"><div class="trip-thumb" style="width:100%;height:122px"></div><span class="pill good" style="margin-top:11px">新しい旅行</span><h3>京都、秋色をめぐる旅</h3><p class="muted" style="font-size:11px">京都 · 11月14日〜16日 · 4人</p><div class="trip-line"><i style="width:16%"></i></div><small class="muted">行きたい場所から、あとで予定を整えられます。</small></div><div style="margin-top:14px"><span class="step-chip">① 旅行を作る</span><span class="step-chip">② 場所を集める</span><span class="step-chip">③ 日程に並べる</span><span class="step-chip">④ みんなと共有</span></div></aside></div>`}
    function resources(){const reservations=state.resourceTab==='reservations';return `${pageHead('TRIP KIT · SC-11 / SC-22','旅の情報を、ひとつの場所へ','予約・チケット・持ち物・準備タスクを旅行の文脈にまとめます。秘密情報は必要な時だけ表示。')}${note()}<div class="section-row" style="margin-bottom:14px"><div><button class="day-tab ${reservations?'active':''}" onclick="state.resourceTab='reservations';render()">予約・チケット</button><button class="day-tab ${!reservations?'active':''}" onclick="state.resourceTab='preparation';render()">準備・持ち物</button></div><span class="pill blue">11/14 — 11/16 · 京都</span></div>${reservations?`<div class="grid dashboard-grid"><div class="grid"><section class="card focus-list"><div class="section-row"><h2 class="section-title">旅行にひもづく予約</h2><button class="btn sm primary" onclick="toast('予約を追加するフォームを開きます')">＋ 予約を追加</button></div><div class="focus-row"><div class="focus-icon">⌂</div><div><b>京都ホテルオークラ</b><small>11/14 チェックイン · 2泊 · 予約済み</small><small style="display:block;margin-top:5px">確認番号　•••• 3942</small></div><button class="mini-link" onclick="revealSecret(this)">表示</button></div><div class="focus-row"><div class="focus-icon">🚄</div><div><b>東海道新幹線 · 京都行き</b><small>11/14 · 東京 07:30 → 京都 09:42</small><small style="display:block;margin-top:5px">チケット　QRは本人のみ</small></div><button class="mini-link" onclick="toast('本人確認後にチケットを表示する想定です')">チケット</button></div><div class="focus-row"><div class="focus-icon">▣</div><div><b>京都文化博物館</b><small>11/14 · 14:00 · 4名</small><small style="display:block;margin-top:5px">予定「京都文化博物館」と連携済み</small></div><button class="mini-link" onclick="go('plan')">予定へ</button></div></section><section class="card" style="padding:17px"><div class="section-row"><h2 class="section-title">予約を予定につなぐ</h2><span class="pill good">3件を連携</span></div><p class="muted" style="font-size:11px">予約から時間・場所を二重入力せず、該当の予定から確認できます。</p><button class="btn sm" onclick="go('plan')">連携した予定を見る →</button></section></div><section class="card focus-list"><h2 class="section-title">秘密情報の扱い</h2><div class="focus-row"><div class="focus-icon">⌑</div><div><b>番号は初期状態でマスク</b><small>タップして開示。共有プレビューには含めません。</small></div></div><div class="focus-row"><div class="focus-icon">⌕</div><div><b>予定から1操作</b><small>予約・券・地図・電話を同じ詳細パネルへ。</small></div></div><div class="focus-row"><div class="focus-icon">↓</div><div><b>当日もオフラインで</b><small>最終同期の時刻を添えて保存情報を確認。</small></div></div><button class="btn" style="width:100%;margin-top:9px" onclick="go('share')">共有される情報を確認</button></section></div>`:`<div class="grid dashboard-grid"><div class="grid"><section class="card focus-list"><div class="section-row"><h2 class="section-title">出発までの準備</h2><span class="pill good">68% 完了</span></div><div class="trip-line" style="height:9px;margin:15px 0"><i style="width:68%"></i></div><div class="focus-row"><div class="focus-icon">✓</div><div><b>新幹線の予約を確認</b><small>担当：有馬 · 完了</small></div><span class="pill good">済</span></div><div class="focus-row"><div class="focus-icon">○</div><div><b>雨具を持ち物に追加</b><small>担当：未設定 · 出発前日まで</small></div><button class="mini-link" onclick="toast('タスクを完了にしました')">完了</button></div><div class="focus-row"><div class="focus-icon">○</div><div><b>ホテルのチェックイン時刻</b><small>予約情報と予定の時間を確認</small><button class="mini-link" onclick="state.resourceTab='reservations';render()">予約を見る</button></div></div></section><section class="card focus-list"><div class="section-row"><h2 class="section-title">持ち物リスト</h2><button class="mini-link" onclick="toast('持ち物を追加するフォームを開きます')">＋ 追加</button></div><div class="excluded"><span class="pill good">✓ モバイルバッテリー</span><span class="pill">□ 折りたたみ傘</span><span class="pill">□ 常備薬</span><span class="pill">□ 充電ケーブル</span><span class="pill">□ 歩きやすい靴</span></div></section></div><section class="card focus-list"><h2 class="section-title">レディネスの内訳</h2><div class="focus-row"><div class="focus-icon">▣</div><div><b>予約・支払い</b><small>3 / 3 確認済み</small></div></div><div class="focus-row"><div class="focus-icon">☑</div><div><b>持ち物</b><small>1 / 5 準備済み</small></div></div><div class="focus-row"><div class="focus-icon">◷</div><div><b>未解決タスク</b><small>2件 · 担当を決める</small></div></div><button class="btn" style="width:100%;margin-top:10px" onclick="go('today')">当日の画面を確認 →</button></section></div>`}`}
    function optimize(){return `${pageHead('PLAN · /optimization','ルートを、見比べて決める','AIや計算の提案は、理由と差分を見てから適用。今の旅程は勝手に変わりません。',`<button class="btn sm" onclick="go('plan')">旅程に戻る</button>`)}${note()}${state.applied?'<div class="comparison-callout" style="margin-bottom:14px"><b>提案を旅程に反映しました。</b> 適用後のプレビューです。<button class="mini-link" onclick="undoOptimize()">元に戻す</button></div>':''}<div class="section-row" style="margin:0 0 14px"><span class="pill">11月14日 · 東山を歩く</span><button class="btn sm ${state.optimized?'primary':''}" onclick="state.optimized=!state.optimized;render()">${state.optimized?'比較を表示中':'変更前／提案を比較'}</button></div><div class="grid compare-grid"><section class="card compare-card before"><div class="section-row"><div><div class="label">CURRENT · 今の旅程</div><h2 class="section-title">ゆったり散策</h2></div><span class="pill">現在</span></div><div class="compare-route">${iconMap}</div><div class="compare-metrics"><div class="compare-metric"><b>74分</b><small>移動時間</small></div><div class="compare-metric"><b>4.8km</b><small>徒歩距離</small></div><div class="compare-metric"><b>45分</b><small>余裕時間</small></div></div><p class="muted" style="font-size:11px">錦市場の滞在を長く取り、東山から北へ移動。</p></section><section class="card compare-card after"><div class="section-row"><div><div class="label">SUGGESTION · 提案</div><h2 class="section-title">移動をまとめる</h2></div><span class="pill ${state.applied?'blue':'good'}">${state.applied?'適用済み':'おすすめ'}</span></div><div class="compare-route">${iconMap}<span class="pill good" style="position:absolute;right:10px;top:10px">移動順を調整</span></div><div class="compare-metrics"><div class="compare-metric"><b class="gain">58分</b><small>移動時間 −16分</small></div><div class="compare-metric"><b class="gain">3.9km</b><small>徒歩 −0.9km</small></div><div class="compare-metric"><b>45分</b><small>余裕時間</small></div></div><div class="comparison-callout"><b>なぜこの提案？</b><br>清水寺の後に錦市場へ寄ってから博物館へ。予約時刻と営業時間への衝突はありません。 <span class="muted">（サンプル計算）</span></div><button class="btn ${state.applied?'':'pri     function share(){return `${pageHead('TOGETHER · SC-34','見せる範囲を決めて共有','公開前に相手の画面を確認。予約番号・チケット・文書・正確な位置は共有対象から除外されます。',`<button class="btn sm" onclick="go('plan')">旅程に戻る</button>`)}${note()}<div class="grid share-layout"><section class="card share-settings"><div class="section-row"><h2 class="section-title">共有リンクの設定</h2><span class="pill good">確認後に発行</span></div><div style="margin:13px 0"><span class="pill">閲覧のみ</span><span class="pill">7日間</span></div>${[['旅のタイトル・日程',true],['予定の場所・時間',true],['旅のメモ',false],['メンバーの名前',false],['費用の概要',false]].map(([t,c])=>`<label class="share-choice"><input type="checkbox" ${c?'checked':''} onchange="toast('共有範囲の設定を更新しました')"><span>${t}</span><span class="muted" style="margin-left:auto">${c?'表示':'非表示'}</span></label>`).join('')}<div class="label" style="margin:14px 0 7px">共有前に除外する情報</div><div class="excluded"><span class="pill warn">予約番号</span><span class="pill warn">チケット・QR</span><span class="pill warn">文書</span><span class="pill warn">正確な位置</span><span class="pill warn">電話・支払</span></div><button class="btn primary" style="width:100%;margin-top:18px" onclick="state.sharePreview=!state.sharePreview;render()">${state.sharePreview?'共有設定へ戻る':'相手のプレビューを見る'}</button><p class="field-help">今のモックでは実際のリンクを発行しません。共有URLはデモ用です。</p></section><section class="guest-preview"><div class="guest-top"><span>◉　TravelCanvas · ゲスト表示</span><span class="pill blue">${state.sharePreview?'プレビュー確認中':'閲覧のみ'}</span></div><div class="guest-cover">${landscape}</div><div class="guest-copy"><div class="eyebrow">11月14日 — 16日 · KYOTO</div><h3>京都、秋色をめぐる旅</h3><p class="muted" style="font-size:11px">東山の朝から、嵐山の夕暮れまで。</p><div class="guest-itinerary"><div class="guest-event"><time>09:30</time><span><b>清水寺</b><br><small class="muted">東山の散策からスタート</small></span></div><div class="guest-event"><time>11:45</time><span><b>錦市場で昼ごはん</b><br><small class="muted">昼食 · 60分</small></span></div><div class="guest-event"><time>14:00</time><span><b>京都文化博物館</b><br><small class="muted">午後の予定</small></span></div></div></div><div class="guest-footer">サンプルの共有プレビュー · 機密情報は表示されません</div></section></div>`}
    function memory(){return `${pageHead('MEMORY · SC-28 / SC-42','旅のあとも、地図に思い出が残る','予定と実績を分けて記録。写真・メモを日程と場所に重ねて、旅の記録へ。',`<button class="btn primary" onclick="toast('写真を追加する操作を体験中です')">＋ 写真・メモを追加</button>`)}${note()}<section class="memory-hero"><div class="memory-art">${iconMap}</div><div class="memory-copy"><div class="eyebrow">JOURNEY REVIEW · KYOTO</div><h2>秋色に出会った、3日間。</h2><p>11月14日 — 16日 · 4人の旅</p><div class="hero-badges"><span class="pill">訪れた場所 8</span><span class="pill">写真 24</span><span class="pill good">記録 84%</span></div><div class="memory-actions"><button class="btn sm primary" onclick="toast('思い出の共有設定へ進みます')">旅行記をプレビュー</button><button class="btn sm" onclick="go('plan')">日程を見る</button></div></div></section><div class="section-row" style="margin:0 0 12px"><h2 class="section-title">東山 · 11月14日</h2><button class="mini-link" onclick="toast('日別の記録を切り替えます')">別の日を見る　⌄</button></div><div class="grid memory-grid"><article class="card memory-card"><div class="memory-photo">${photoSVG(0)}</div><div class="memory-copy2"><b>朝の清水寺</b><small>09:42 · 行った · 写真 3枚</small><span class="pill good" style="margin-top:8px">自分だけに保存</span></div></article><article class="card memory-card"><div class="memory-photo alt">${photoSVG(1)}</div><div class="memory-copy2"><b>錦市場の寄り道</b><small>12:20 · 行った · 写真 5枚</small><span class="pill" style="margin-top:8px">メモあり</span></div></article><article class="card memory-card"><div class="memory-photo alt2">${photoSVG(2)}</div><div class="memory-copy2"><b>白川の夕暮れ</b><small>16:38 · 行った · 写真 4枚</small><span class="pill good" style="margin-top:8px">共有前に確認</span></div></article></div><section class="card" style="padding:15px;margin-top:14px"><div class="section-row"><span><b style="font-size:12px">公開前チェック</b><small class="muted">　同行者名・予約・電話・位置情報の確認</small></span><button class="btn sm" onclick="toast('非公開項目のチェック一覧を表示します')">チェックする</button></div></section>`}
    function eventRows(){const mode=[['🚶','徒歩'],['🚶','徒歩'],['🚌','バス'],['🚶','徒歩'],['🚕','車']];const hours=[['09:00–18:00','開館中'],['10:00–18:00','営業中'],['10:00–19:30','営業中'],['終日','屋外'],['17:00–18:00','18:00着 · 閉店時刻']];return events().map((e,i)=>'<div class="event-row '+(state.selected===i?'selected':'')+'" draggable="true" ondragstart="startEventDrag(event,'+i+')" ondragover="event.preventDefault()" ondrop="dropEvent(event,'+i+')" role="listitem" tabindex="0" aria-label="'+e.title+'。上下ボタンで順番変更" onclick="selectEvent('+i+')" onkeydown="if(event.key===\'Enter\')selectEvent('+i+')"><div class="event-time">'+e.time+'</div><div class="event-dot"></div><div class="event-info"><div class="event-topline"><b>'+e.title+'</b><span class="event-mode">'+mode[i%mode.length][0]+' '+mode[i%mode.length][1]+'</span></div><small>'+e.meta+'</small><div class="event-meta"><span class="pill '+e.kind+'">'+e.badge+'</span></div><div class="event-hours '+(i===4?'warn':'')+'">◷ '+hours[i%hours.length][0]+' · '+hours[i%hours.length][1]+' <span class="muted">（営業時間表示例）</span></div></div><div class="event-actions"><button aria-label="上へ移動" onclick="event.stopPropagation();moveEvent('+i+',-1)">↑</button><button aria-label="下へ移動" onclick="event.stopPropagation();moveEvent('+i+',1)">↓</button></div></div>').join('')}
    function detailHTML(){const e=selectedEvent();return '<aside class="card detail-card"><div class="detail-art">'+photoSVG(state.photoChoice%3)+'<span class="photo-source">場所画像のイメージ</span></div><div><div class="label">選択中の予定 · DAY '+String(state.day+1).padStart(2,'0')+'</div><h3>'+e.title+'</h3><p>京都市東山区 · '+e.time+'から'+e.meta.split('·')[0].trim()+'</p></div><div class="detail-actions"><button class="btn sm" onclick="toast(\'地図アプリを開きます（デモ）\')">↗ 地図</button><button class="btn sm" onclick="toast(\'予約・チケットを開きます（デモ）\')">▣ 予約</button><button class="btn sm" onclick="go(\'discover\')">写真を選ぶ</button></div><div class="detail-facts"><span><b>営業時間</b><small>'+(state.selected===4?'17:00–18:00 · L.O. 17:30':'09:00–18:00 · 最終入場 17:30')+'</small></span><span><b>予定との照合</b><small class="'+(state.selected===4?'warn':'good')+'">'+(state.selected===4?'18:00到着 · 営業終了と重複 ⚠':'09:30到着 · 営業時間内 ✓')+'</small></span><span><b>出典・確認</b><small>施設公式 · 2026/10/26（例）</small></span><span><b>移動</b><small>🚶 徒歩 18分 · 1.2km</small></span></div></aside>'}
    function crossDayView(){let html='<section class="card" style="padding:16px"><div class="section-row"><div><div class="label">11/14 — 11/16 · KYOTO</div><h2 class="section-title">全日程の横断チャート</h2><small class="muted">日ごとの予定密度と空き時間を見比べる</small></div><button class="btn sm" onclick="state.planView=\'day\';render()">日別タイムラインへ</button></div><div class="cross-grid">';days.forEach((d,di)=>{html+='<section class="cross-day"><div class="cross-day-head"><div class="label">DAY '+(di+1)+'</div><b>'+d[0]+' · '+d[1]+'</b><div class="muted" style="font-size:10px">現地時間 · Asia/Tokyo</div></div>';baseEvents[di].forEach((e,i)=>{html+='<div class="cross-event"><time>'+e.time+'</time><span>'+['🚶','🚶','🚌','🚶','🚄'][i%5]+'<b>'+e.title+'</b><small class="muted">'+e.meta+'</small></span></div>'});html+='<button class="mini-link" onclick="setDay('+di+')">この日を編集 →</button></section>'});return html+'</div></section>'}
    function planner(){let controls='<div class="plan-controls"><button class="day-tab '+(state.planView==='day'?'active':'')+'" onclick="state.planView=\'day\';render()">日別</button><button class="day-tab '+(state.planView==='all'?'active':'')+'" onclick="state.planView=\'all\';render()">全日程</button><button class="btn sm" onclick="go(\'discover\')">⌕ 近くを発見</button><button class="btn sm" onclick="state.timezoneExample=!state.timezoneExample;render()">🌐 海外時差の表示例</button></div>';let tz=state.timezoneExample?'<div class="timezone-card"><div class="label">時差をまたぐ移動 · 表示例</div><div class="timezone-pair"><div><strong>22:45</strong><small>9/19 · 東京 / JST (UTC+9)</small></div><span>✈ 14時間30分 →</span><div><strong>00:15</strong><small>9/20 · ニューヨーク / EDT (UTC−4)</small></div></div><small class="muted">出発地・到着地の現地日付と時刻を並べるUI例。飛行時間は例。</small></div>':'';let head=pageHead('PLAN · SC-06','旅程を組み立てる','営業時間・移動手段・現地時間を予定カードで確認。ドラッグまたは↑↓で順番を入れ替えます。','<button class="btn primary" onclick="go(\'quick\')">＋ 予定を追加</button>');if(state.planView==='all')return head+note()+controls+tz+crossDayView();return head+note()+controls+tz+'<div class="planner-layout '+((state.theme==='atlas'||state.theme==='studio')?'map-first':'')+'"><section class="card timeline-card"><div class="section-row"><div><div class="label">KYOTO · DAY '+(state.day+1)+' · LOCAL TIME</div><h2 class="section-title">'+days[state.day][1]+'</h2></div><button class="mini-link" onclick="go(\'optimize\')">ルートを見る ↗</button></div><div class="day-tabs">'+days.map((d,i)=>'<button class="day-tab '+(state.day===i?'active':'')+'" onclick="setDay('+i+')">'+d[0]+'</button>').join('')+'</div><div class="event-legend"><span>🚶 徒歩</span><span>🚌 バス</span><span>🚄 新幹線</span><span>🚕 タクシー</span><span>🚗 自家用車</span><span>🚁 ヘリ（要手配）</span></div>'+eventRows()+'<button class="btn sm" style="width:100%;margin-top:5px" onclick="go(\'quick\')">＋ 日程に追加する</button><small class="field-help">営業時間は表示例。実装時は出典・確認時刻とともに表示。</small></section>'+mapHTML()+detailHTML()+'</div>'}
    const discoveryItems=[['食べ物','🍡','甘味処 · 祇園の和菓子','徒歩 8分','地図・店舗情報',0],['市場','🥢','錦市場の食べ歩き','1.4km','旅行者の投稿',1],['買い物','🛍️','清水坂の工芸店','650m','地域ガイド',2],['絶景','🌄','鴨川沿いの夕景','1.1km','写真投稿・位置情報',1],['食べ物','🍜','地元の小さな食堂','900m','旅行者の投稿',2],['絶景','⛩️','東山の朝景色','徒歩 12分','編集ガイド',0]];
    function importSocial(){const input=document.getElementById('socialUrl');if(!input||!input.value.trim()){toast('SNS投稿URLを入力してください');return}state.socialImported=true;render();toast('投稿URLの候補プレビューを表示しました（デモ）')}
    function discover(){const cats=['すべて','食べ物','市場','買い物','絶景'];const items=discoveryItems.filter(x=>state.discoverCategory==='すべて'||x[0]===state.discoverCategory);let html=pageHead('DISCOVER · SC-08','近くの「行きたい」を集める','周辺検索やSNS投稿を候補箱に集め、内容を確認してから旅程へ。')+note()+'<div class="discover-tools"><section class="card focus-list"><div class="label">NEARBY · 京都 東山 · 半径 2km</div><div class="discover-query"><input value="東山で、地元の人が行く甘味処" aria-label="周辺検索キーワード"><button class="btn primary" onclick="toast(\'周辺候補を更新しました（デモ）\')">周辺を検索</button></div><div class="category-pills">';cats.forEach(c=>html+='<button class="'+(state.discoverCategory===c?'active':'')+'" onclick="state.discoverCategory=\''+c+'\';render()">'+c+'</button>');html+='</div><small class="field-help">カテゴリ：食べ物・市場・買い物・絶景。地点と検索半径を指定。</small></section><section class="card social-import"><div class="section-row"><h2 class="section-title">SNSから取り込む</h2><span class="pill blue">Instagram · TikTok · YouTube</span></div><p class="muted" style="font-size:11px">投稿URLから場所・本文候補を読み取り、出典と一緒に候補化する案。</p><input id="socialUrl" placeholder="https://www.instagram.com/reel/..." aria-label="SNS投稿URL"><div class="source-row"><span class="pill">URLを出典保存</span><span class="pill">内容をプレビュー</span><span class="pill warn">確認してから追加</span></div><button class="btn primary" style="width:100%" onclick="importSocial()">URLを解析して候補を確認</button>'+(state.socialImported?'<div class="social-preview"><b>候補プレビュー · 京都の朝ごはん</b><br>場所候補：東山エリア · 信頼度 中 · 元投稿を出典に保存<br><button class="btn sm" onclick="toast(\'候補箱へ追加しました（デモ）\')">候補箱へ追加</button></div>':'<small class="field-help">現行コードではURLを出典として保存。本文や画像の自動取得は未接続。</small>')+'</section></div><div class="section-row" style="margin-top:16px"><h2 class="section-title">周辺で見つかった候補</h2><span class="pill">'+items.length+'件 · 出典つき</span></div><div class="discover-grid">';items.forEach(x=>{html+='<article class="card discover-card"><div class="discover-photo">'+photoSVG(x[5])+'<span class="photo-source">'+x[4]+' · 画像イメージ</span></div><div class="discover-copy"><h3>'+x[1]+' '+x[2]+'</h3><small>'+x[0]+' · '+x[3]+' · 出典の鮮度を表示</small><div class="photo-tune"><button onclick="state.selected=0;state.photoChoice='+x[5]+';go(\'plan\');toast(\'予定カード画像を変更（デモ）\')">写真を旅程に差し込む</button><button onclick="toast(\'候補として保存しました（デモ）\')">＋ 候補へ</button></div></div></article>'});return html+'</div><section class="card focus-list" style="margin-top:14px"><div class="section-row"><h2 class="section-title">場所画像を自動提案する案</h2><span class="pill good">編集前にプレビュー</span></div><p class="muted" style="font-size:11px">場所名・エリアから代表画像を提案 → 出典・利用条件・更新日を表示 → 旅行カバーや予定カードに適用。画像がない場合は地図・イラストを表示します。</p><div class="photo-tune"><button onclick="state.photoChoice=(state.photoChoice+1)%3;render()">候補画像を入れ替える</button><span class="pill">現画面はイラストの代替</span><span class="pill">実装時は提供元・利用条件を明示</span></div></section>'}
    function moveEvent(i,delta){const a=baseEvents[state.day],j=i+delta;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];state.selected=j;render();toast('順番を入れ替えました。営業時間と移動を再確認してください')}
    function startEventDrag(e,i){state.dragIndex=i;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(i))}
    function dropEvent(e,i){e.preventDefault();const from=state.dragIndex;if(from==null||from===i)return;const a=baseEvents[state.day],[item]=a.splice(from,1);a.splice(i,0,item);state.dragIndex=null;state.selected=i;render();toast('順番を入れ替えました。営業時間と移動を再確認してください')}
    function render(){document.getElementById('app').dataset.theme=state.theme;document.getElementById('main').className=`main ${state.theme}`;const title=screens[state.screen][0];document.title=`${title} · TravelCanvas UI/UX Lab`;document.querySelectorAll('.rail button[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===state.screen));document.querySelectorAll('.theme-button').forEach(b=>b.classList.toggle('active',b.dataset.themeChoice===state.theme));const view={home,plan:planner,discover,today,resources,quick,optimize,share,memory}[state.screen]();document.getElementById('main').innerHTML=view}
    function go(screen){state.screen=screen;if(screen==='today')state.revealed=false;render();window.scrollTo({top:0,behavior:'smooth'})}
    function setDay(i){state.day=i;state.selected=0;render()}
    function selectEvent(i){state.selected=i;render()}
    let toastTimer;function toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300)}
    function saveQuick(e){e.preventDefault();const title=document.getElementById('title').value.trim()||'新しい旅';const place=document.getElementById('first').value.trim();state.added=place?[{time:'未定',title:place,meta:'最初の候補 · あとから時間を決められます',badge:'新しく追加',kind:'blue'}]:[];go('plan');toast(`「${title}」を保存しました · 旅程に移動します`)}
    function applyOptimize(){state.applied=true;state.optimized=true;render();toast('提案を旅程に反映しました · いつでも戻せます')}
    function undoOptimize(){state.applied=false;render();toast('元の旅程に戻しました')}
    function revealTicket(){state.revealed=!state.revealed;render()}
    function revealSecret(button){button.textContent=button.textContent==='表示'?'DEMO 3942':'表示';toast(button.textContent==='表示'?'予約番号をマスクしました':'サンプル番号を表示中です')}
    document.querySelectorAll('.rail button[data-screen]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.screen)));
    document.querySelectorAll('.theme-button').forEach(b=>b.addEventListener('click',()=>{state.theme=b.dataset.themeChoice;render()}));
    render();
  </script>
