# [Gate G3] CI-03 Python の型の検査(mypy)。既存のコードの型の誤りは mypy-baseline.txt に記録し、
# それより増えたら CI を落とす(scripts/ci/check_mypy_baseline.py)。新しく足すモジュールは厳しく検査する。
# [Gate G10-Q] 1,382 件 → 0 件(models を Mapped[...] へ・ghost code の削除・None の扱いの修正)。基準は空 = 1件でも失敗
[mypy]
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
show_error_codes = True
no_color_output = True
warn_redundant_casts = True
# [Gate G10-Q] 型の誤りが 0 件になったため、不要になった type: ignore も残さない(78 → 8 件)
warn_unused_ignores = True
# [Gate G10-Q] Pydantic の model・BaseSettings の __init__ を正しく型付けする(Settings() の必須の値は環境変数から入る)
plugins = pydantic.mypy

# 新しいモジュール(Gate G3 以降): 型注釈の無い関数を許さない
[mypy-app.ops.schema_snapshot,app.services.data_keys,app.services.mfa_keys,app.core.error_catalog]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
