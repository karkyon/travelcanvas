# TravelCanvas Backend Docker Compose Configuration
version: '3.8'

services:
  # =================================
  # PostgreSQL Database
  # =================================
  db:
    image: postgres:15-alpine
    container_name: travelcanvas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: travelcanvas
      POSTGRES_USER: travelcanvas_user
      POSTGRES_PASSWORD: travelcanvas_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - travelcanvas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelcanvas_user -d travelcanvas"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =================================
  # Redis Cache & Session Store
  # =================================
  redis:
    image: redis:7-alpine
    container_name: travelcanvas_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass travelcanvas_redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - travelcanvas_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =================================
  # TravelCanvas Backend API
  # =================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: travelcanvas_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://travelcanvas_user:travelcanvas_password@db:5432/travelcanvas
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: travelcanvas
      DATABASE_USER: travelcanvas_user
      DATABASE_PASSWORD: travelcanvas_password
      
      # Redis
      REDIS_URL: redis://:travelcanvas_redis_password@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: travelcanvas_redis_password
      
      # Application
      ENVIRONMENT: production
      DEBUG: false
      HOST: 0.0.0.0
      PORT: 8000
      
      # JWT
      JWT_SECRET_KEY: your-production-jwt-secret-key-change-this
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      
      # Security
      BCRYPT_ROUNDS: 12
      
      # Rate Limiting
      RATE_LIMIT_GUEST: 100
      RATE_LIMIT_USER: 1000
      RATE_LIMIT_AUTH: 5
      
      # Logging
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      
      # CORS
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:8080", "https://your-frontend-domain.com"]'
      
      # External APIs (set these in production)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./temp:/app/temp
    ports:
      - "8000:8000"
    networks:
      - travelcanvas_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =================================
  # Celery Worker (for background tasks)
  # =================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: travelcanvas_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://travelcanvas_user:travelcanvas_password@db:5432/travelcanvas
      
      # Redis
      REDIS_URL: redis://:travelcanvas_redis_password@redis:6379/0
      
      # Celery
      CELERY_BROKER_URL: redis://:travelcanvas_redis_password@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:travelcanvas_redis_password@redis:6379/1
      
      # Application
      ENVIRONMENT: production
      DEBUG: false
      
      # External APIs
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./temp:/app/temp
    networks:
      - travelcanvas_network
    command: celery -A app.celery worker --loglevel=info
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =================================
  # Celery Beat (for scheduled tasks)
  # =================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: travelcanvas_scheduler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://travelcanvas_user:travelcanvas_password@db:5432/travelcanvas
      
      # Redis
      REDIS_URL: redis://:travelcanvas_redis_password@redis:6379/0
      
      # Celery
      CELERY_BROKER_URL: redis://:travelcanvas_redis_password@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:travelcanvas_redis_password@redis:6379/1
      
      # Application
      ENVIRONMENT: production
      DEBUG: false
      
    volumes:
      - ./logs:/app/logs
    networks:
      - travelcanvas_network
    command: celery -A app.celery beat --loglevel=info
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery", "inspect", "active"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =================================
  # Nginx Reverse Proxy (Optional)
  # =================================
  nginx:
    image: nginx:alpine
    container_name: travelcanvas_nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - travelcanvas_network
    profiles:
      - with-nginx

  # =================================
  # Prometheus (Monitoring)
  # =================================
  prometheus:
    image: prom/prometheus:latest
    container_name: travelcanvas_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - travelcanvas_network
    profiles:
      - monitoring
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  # =================================
  # Grafana (Dashboards)
  # =================================
  grafana:
    image: grafana/grafana:latest
    container_name: travelcanvas_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - travelcanvas_network
    profiles:
      - monitoring

  # =================================
  # pgAdmin (Database Management)
  # =================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: travelcanvas_pgadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@travelcanvas.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - travelcanvas_network
    profiles:
      - tools

# =================================
# Networks
# =================================
networks:
  travelcanvas_network:
    driver: bridge
    name: travelcanvas_network

# =================================
# Volumes
# =================================
volumes:
  postgres_data:
    driver: local
    name: travelcanvas_postgres_data
  
  redis_data:
    driver: local
    name: travelcanvas_redis_data
  
  prometheus_data:
    driver: local
    name: travelcanvas_prometheus_data
  
  grafana_data:
    driver: local
    name: travelcanvas_grafana_data
  
  pgadmin_data:
    driver: local
    name: travelcanvas_pgadmin_data
