name: travelcanvas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME_DEV:-travelcanvas}
      POSTGRES_USER: ${DB_USER:-travelcanvas_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - travelcanvas_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - travelcanvas_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-travelcanvas_app} -d ${DB_NAME_DEV:-travelcanvas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
      else
        redis-server --appendonly yes;
      fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - travelcanvas_redisdata:/data
    expose:
      - "6379"
    networks:
      - travelcanvas_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORS_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
      API_CORS_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - travelcanvas_uploads:/app/uploads
      - ./backend:/app
    networks:
      - travelcanvas_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8001
      VITE_APP_NAME: TravelCanvas
    ports:
      - "4173:4173"
    depends_on:
      - backend
    networks:
      - travelcanvas_net

volumes:
  travelcanvas_pgdata:
    name: travelcanvas_pgdata
  travelcanvas_redisdata:
    name: travelcanvas_redisdata
  travelcanvas_uploads:
    name: travelcanvas_uploads

networks:
  travelcanvas_net:
    name: travelcanvas_default
