name: travelcanvas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME_DEV:-travelcanvas}
      POSTGRES_USER: ${DB_USER:-travelcanvas_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - travelcanvas_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - travelcanvas_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-travelcanvas_app} -d ${DB_NAME_DEV:-travelcanvas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
      else
        redis-server --appendonly yes;
      fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - travelcanvas_redisdata:/data
    expose:
      - "6379"
    networks:
      - travelcanvas_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # [Gate G2] SEC-F4 migration と DB の権限の設定だけを行う一回きりの処理(終わると止まる)。所有者(.env の DATABASE_URL)
  # の資格情報を持つのはこのサービスだけ。backend はこれが成功してから起動し、表の読み書きだけのロール(tc_app)で接続する
  # (backend/app/ops/db_roles.py、docs/adr/ADR-db-roles.md)。
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: "no"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      PYTHONDONTWRITEBYTECODE: "1"
      TC_DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set in .env (Gate G2)}
    command: ["sh", "-c", "alembic upgrade head && python -m app.ops.db_roles apply"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - travelcanvas_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORS_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
      API_CORS_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
      # [Gate G2] SEC-F4 アプリは tc_app(表の読み書きだけ。表を作る・変える・消すはできない)で接続する。
      # .env の DATABASE_URL(所有者)・DB_PASSWORD・DB_APP_PASSWORD はこのコンテナへ渡さない(空で上書きする)
      DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL must be set in .env (Gate G2)}
      DB_PASSWORD: ""
      DB_APP_PASSWORD: ""
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - travelcanvas_uploads:/app/uploads
      - ./backend:/app
    networks:
      - travelcanvas_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # [Gate #8] VITE_API_URLはビルド時にVite静的バンドルへ埋め込む必要があるため、
      # 下のenvironment:(コンテナ起動時の値、Viteには無効)ではなくbuild.args経由で渡す。
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    restart: unless-stopped
    environment:
      # 画面が使う API はビルド時に埋め込まれた値(上の build.args)。
      # [Gate S2] 起動時の値は vite preview が CSP の通信先(connect-src 等)に使うため、ビルド時と同じ値にする
      # (以前は http://localhost:8001 固定で、.env の VITE_API_URL を変えると CSP が API への通信を止めた)。
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
      VITE_APP_NAME: TravelCanvas
      # [Gate H1] 画面を開いてよい名前(omega-dev2・LAN の IP 等、カンマ区切り)。backend は .env から同じ値を読み、
      # その名前の :4173 を CORS に足す。画面は開いた名前の :8001 を API にする
      TC_PUBLIC_HOSTS: ${TC_PUBLIC_HOSTS:-}
    ports:
      - "4173:4173"
    depends_on:
      - backend
    networks:
      - travelcanvas_net

  # [Gate S4] F09 ウイルス検査(任意)。`docker compose --profile malware-scan up -d clamav` で起動し、
  # .env に MALWARE_SCAN_BACKEND=clamav を書いて backend を作り直す(Runbook §3.8)。
  # 定義ファイルの取得に数分・メモリ約1.5GBを使うため、既定では起動しない。
  clamav:
    image: clamav/clamav:1.4
    profiles: ["malware-scan"]
    restart: unless-stopped
    volumes:
      - travelcanvas_clamav:/var/lib/clamav
    expose:
      - "3310"
    networks:
      - travelcanvas_net
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

volumes:
  travelcanvas_clamav:
    name: travelcanvas_clamav
  travelcanvas_pgdata:
    name: travelcanvas_pgdata
  travelcanvas_redisdata:
    name: travelcanvas_redisdata
  travelcanvas_uploads:
    name: travelcanvas_uploads

networks:
  travelcanvas_net:
    name: travelcanvas_default
