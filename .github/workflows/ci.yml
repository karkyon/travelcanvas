name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (非ブロッキング・既知の負債を可視化するのみ)
        run: npx eslint . --ext ts,tsx || echo "::warning::eslintで問題が検出されました(現時点では既知の技術的負債として非ブロッキング。Gate 4で解消予定)"
        continue-on-error: true

      - name: Build (ブロッキング)
        run: npx vite build

      # 注意: `tsc`によるTypeScript型チェックは意図的に含めていない。
      # 現時点で418件の既知エラーがあり(型定義未整備・store実装未接続等、
      # Planner/DragDrop/Optimization機能群が構造的に未完成なことが原因)、
      # Gate 4(計画コア)着手時に型・store実装を本格修復した後、
      # このワークフローへ`npx tsc --noEmit`をブロッキングとして追加すること。

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc g++ libjpeg-dev libpng-dev libgeos-dev libproj-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Lint (非ブロッキング・既知の負債を可視化するのみ)
        run: |
          pip install flake8
          flake8 app --max-line-length=120 --count || echo "::warning::flake8で問題が検出されました(現時点では既知の技術的負債として非ブロッキング)"
        continue-on-error: true

      - name: Import smoke test (ブロッキング)
        run: python -c "from app.main import app; print('app import OK:', app.title if hasattr(app, \"title\") else app)"

      # 注意: `mypy`による型チェックも同様に意図的に含めていない。
      # backend/pyproject.toml に poetry ベースの別依存定義が存在するが、
      # 実際にDockerfileが使用するのは requirements.txt (pip) であり、
      # pyproject.tomlは重複・未整理のまま放置されている(別途整理が必要)。
