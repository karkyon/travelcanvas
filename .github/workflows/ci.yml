name: CI

on:
  push:
    # [Gate S11] SEC-24 パッチは検証した commit をまず gate/<名前> へ送り、ここで全ジョブに合格してから
    # 同じ commit を main へ送る(scripts/ops/ci_gate.py、Runbook §9)。main は必須の CI で保護する。
    branches: [main, 'gate/**']
  pull_request:
    branches: [main]

# 同じブランチへの古い実行は取り消す(main は取り消さない: 合格の記録を残すため)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# [Gate L5-r2] ubuntu-latest は 2026-10-19 から Ubuntu 26 へ順次移る。移行中に E2E の結果が揺れたため、24.04 に固定する
# (移すときは別の Gate で全ジョブを確かめてから)。
jobs:
  # [Gate R0] tracked secret scanをCIでblocking化する。
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # [Gate S1] 判定(一致した文字列にダミーの印があるときだけ除外)の自己試験も行う
      - name: Secret scanner self-test (ブロッキング)
        run: python3 scripts/security/scan_secrets.py --self-test

      - name: Scan tracked files for secrets (ブロッキング)
        run: python3 scripts/security/scan_secrets.py

  # [Gate S1] SEC-23 依存ライブラリの既知の脆弱性の検査。例外は scripts/security/dependency-allowlist.json
  # (助言の ID 単位・理由・範囲・期限が必須。期限切れ・ブラウザへ届く依存の build-only 例外は失敗)。
  dependency-audit:
    needs: secret-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Audit checker self-test (ブロッキング)
        run: python3 scripts/security/audit_deps.py self-test

      - name: Install pip-audit (requirements-dev.txt の版)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$(grep -E '^pip-audit==' backend/requirements-dev.txt)"

      - name: Python dependencies (pip-audit, ブロッキング)
        run: python scripts/security/audit_deps.py python

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Node dependencies (npm audit, ブロッキング)
        run: python3 scripts/security/audit_deps.py node

      # [Gate G1] CI-02 依存の一覧(SBOM、CycloneDX)を commit ごとに残す
      - name: Frontend SBOM (CycloneDX)
        working-directory: frontend
        run: |
          mkdir -p ../ci-results
          npm sbom --sbom-format cyclonedx --omit dev > ../ci-results/frontend-sbom.cdx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: ci-results/
          retention-days: 90
          if-no-files-found: warn

  frontend:
    needs: secret-scan
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # [Gate M9-FE-C1] frontend ESLintをblocking化する。
      # Gate M9時点(2026-09-13)の199 error / 17 warningは、Gate M9-FE-A1/A2/B1
      # (error 0件)、B2(Fast Refresh警告6件)、B3(hooks依存警告11件・既存
      # eslint-disable除去)で0 error / 0 warningまで解消済み。以降はpackage.jsonの
      # lint script(--report-unused-disable-directives --max-warnings 0)をそのまま
      # 実行し、error・warning・未使用のeslint-disableが1件でもあればjobを失敗させる。
      # (以前の`|| echo`と`continue-on-error: true`は、失敗を握りつぶすため削除)
      - name: Lint (ブロッキング)
        run: npm run lint

      # [Gate #31.5A] 以前はここに「418件の既知エラーがあるため意図的に
      # 含めていない」という注意書きがあったが、独立検証の結果 tsc --noEmit
      # は0エラーであり、コメント自体が陳腐化していた(コメントが現実と
      # 矛盾する状態を放置していた)。実態に合わせてblocking化する。
      - name: Type-check (ブロッキング)
        run: npx tsc --noEmit

      - name: Build (ブロッキング)
        run: npx vite build

      # [Gate G1] DEP-05 bundle の上限(最初に読む JS 430kB(Gate G9 Q03 で 450 から下げた)・gzip 150kB、1つの塊 500kB)
      - name: Bundle budget (ブロッキング)
        run: python3 ../scripts/ci/check_bundle_budget.py --dist dist

      # [Gate G3] DEP-04 試験の出力に想定外のエラー・警告を残さない(標準エラー 0 行)。CI-02 結果(JUnit)と
      # coverage を残す。再試行はしない(vitest.config.ts の retry: 0)
      - name: Unit tests (ブロッキング)
        run: |
          mkdir -p ../ci-results
          npm test -- --run --coverage --coverage.reporter=text-summary --coverage.reporter=cobertura \
            --coverage.reportsDirectory=../ci-results/frontend-coverage \
            --reporter=default --reporter=junit --outputFile.junit=../ci-results/vitest-junit.xml \
            2> ../ci-results/vitest-stderr.txt
          python3 ../scripts/ci/check_test_output.py ../ci-results/vitest-stderr.txt

      - name: Unit tests の要約
        if: always()
        run: python3 ../scripts/ci/junit_summary.py --title "frontend vitest" ../ci-results/vitest-junit.xml

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-tests-${{ github.sha }}
          path: ci-results/
          retention-days: 30
          if-no-files-found: warn

  backend:
    runs-on: ubuntu-24.04
    needs: secret-scan
    defaults:
      run:
        working-directory: backend
    # [Gate #31.5A] 以前はPostgreSQLサービスが無く、DATABASE_URL/JWT_SECRET_KEY
    # (どちらもデフォルト値を持たない必須設定)も一切注入されていなかったため、
    # 「Import smoke test」自体が起動時のPydantic必須項目バリデーションで
    # 失敗していた(mainブランチのActionsがbackend jobで恒常的に赤くなって
    # いた直接原因)。CI専用の非秘密な固定値を用いて解消する。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: travelcanvas_app
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          POSTGRES_DB: travelcanvas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U travelcanvas_app"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      # [Gate CI-Redis] 以前は Redis が無く、Redis を使う試験(回数制限の共有・共同編集の知らせ・FR-059 の停止の共有)が
      # 全て飛ばされたまま合格になっていた。使い捨ての Redis を置き、TC_REQUIRE_REDIS=1 で飛ばさず実行する。
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # CI専用の非秘密な固定値。本番/開発環境の値とは一切関係が無く、
      # このジョブの使い捨てPostgreSQLコンテナにのみ通用する。
      DATABASE_URL: postgresql://travelcanvas_app:ci-only-not-a-real-secret@localhost:5432/travelcanvas_test
      JWT_SECRET_KEY: ci-only-dummy-jwt-secret-not-used-anywhere-else
      REDIS_URL: redis://localhost:6379/0
      TC_REQUIRE_REDIS: "1"
    steps:
      # [Gate G1] GOV-01 DOC-10 の基準 commit が履歴にあるかを確かめるため、履歴を全部取る
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc g++ libjpeg-dev libpng-dev libgeos-dev libproj-dev

      # [Gate S1] 実行時の依存(requirements.txt)と、試験・lint・監査の道具(requirements-dev.txt、版を固定)
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      # [Gate M9] 2026-09-13時点でリポジトリにflake8設定が皆無で
      # デフォルトmax-line-length=79実測2,112件(非blocking扱い)
      # だった。backend/.flake8を新設し(max-line-length=120,
      # E203/W503除外、適用済み過去migrationを除外)現実的な
      # ルールセットへ改め、指摘0件まで解消したうえでblocking化する。
      - name: Lint (ブロッキング)
        run: flake8 app alembic scripts tests --count

      - name: Import smoke test (ブロッキング)
        run: python -c "from app.main import app; print('app import OK:', app.title if hasattr(app, \"title\") else app)"

      # GCP公開用と同じproduction targetを毎回ビルドし、Dockerfile破損をmainへ入れない。
      - name: Production container build (ブロッキング)
        run: docker build --target production --tag "travelcanvas-backend-ci:${{ github.sha }}" .

      # [Gate O1] 運用コマンド(ホストの python3 で標準ライブラリだけで動くこと)の起動確認
      - name: Ops CLI smoke test (ブロッキング)
        run: |
          python3 ../scripts/ops/tcops.py --help > /dev/null
          python3 ../scripts/ops/tcops.py schedule print | grep -q "travelcanvas ops"

      # [Gate G3] CI-02 migration の前後の DB の構造(schema)を写して差分を残す。往復(下げて上げる)の後の構造が
      # 最初の head と同じであることも確かめる(downgrade の書き漏れを検出)
      - name: Alembic upgrade -> downgrade -> upgrade・構造の差分 (ブロッキング)
        run: |
          mkdir -p ../ci-results
          alembic upgrade head
          python -m app.ops.schema_snapshot > ../ci-results/schema-head.txt
          alembic downgrade -1
          python -m app.ops.schema_snapshot > ../ci-results/schema-previous.txt
          alembic upgrade head
          python -m app.ops.schema_snapshot > ../ci-results/schema-head-again.txt
          python -m app.ops.schema_snapshot --diff ../ci-results/schema-previous.txt ../ci-results/schema-head.txt > ../ci-results/migration-schema-diff.txt
          diff -u ../ci-results/schema-head.txt ../ci-results/schema-head-again.txt

      # [Gate G3] CI-03 型の検査。既存の誤りは backend/mypy-baseline.txt の基準まで(増えたら失敗)
      - name: Type-check mypy (ブロッキング・基準より増やさない)
        run: python3 ../scripts/ci/check_mypy_baseline.py

      # [Gate S11] 以前は CI に ENCRYPTION_KEY・CORS_ORIGINS・文書の保存先が無く、34件が失敗し続けていた
      # (2026-09-17 以降 main の CI は赤のまま)。tests/conftest.py が試験だけの既定値を入れる。
      # [Gate G1] CI-02 結果を JUnit で残し、GOV-03 VERIFIED の証拠(台帳が参照する試験)がこの実行で合格したかを照合する
      - name: pytest 全件 (ブロッキング)
        run: python -m pytest tests/ -v --junitxml=../ci-results/backend-junit.xml --cov=app --cov-report=term:skip-covered --cov-report=xml:../ci-results/backend-coverage.xml

      - name: pytest の要約
        if: always()
        run: python3 ../scripts/ci/junit_summary.py --title "backend pytest" ../ci-results/backend-junit.xml

      - name: VERIFIED の証拠の合格の照合 (ブロッキング)
        run: python3 ../scripts/ci/check_ledger_results.py backend --junit ../ci-results/backend-junit.xml

      # [Gate CI-Redis] Redis を使う試験が実行されて合格したこと・Redis の理由の飛ばしが 0 件であること(飛ばした試験は全て一覧に出す)
      - name: Redis を使う試験の実行の確認 (ブロッキング)
        if: always()
        run: >-
          python3 ../scripts/ci/check_required_tests.py --junit ../ci-results/backend-junit.xml
          --forbid-skip-reason Redis
          --require tests/test_gate_fr059c_shared_suspension.py
          --require tests/test_gate_s3_rate_limit.py
          --min-run 17

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit-${{ github.sha }}
          path: ci-results/
          retention-days: 30
          if-no-files-found: warn

      # [Gate G3] CI-03 mypy は上の「Type-check mypy」で行う(backend/mypy.ini・mypy-baseline.txt)。

  # [Gate R2-6] docs/trace/gate-r2-trace.md のR2-5行が「未達」としていた
  # 「Playwright browser E2E」「CIへのE2E blocking追加」を満たすジョブ。
  # frontend/backend jobとは別に、docker composeでフルスタック(postgres/
  # redis/backend/frontend)を実際に起動し、匿名ゲスト開始→QuickDraft作成
  # →promote→reload後の永続化確認までを本物のブラウザ(chromium)で検証する。
  e2e:
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    # [Gate G3] CI-04 flaky の issue を作るため(他は読むだけ)
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      # docker-compose.ymlはDB_PASSWORD等を.envからの読込み必須としている
      # (`${DB_PASSWORD:?DB_PASSWORD must be set in .env}`)。このジョブの
      # 使い捨てスタックにのみ通用するCI専用の非秘密な固定値を注入する。
      # ENCRYPTION_KEYはbackend/app/core/crypto.pyがsha256で決定的に鍵導出
      # するため、任意の文字列で良い(Fernet形式の事前生成は不要)。
      - name: Create CI-only .env for docker compose
        run: |
          cat > .env <<'EOF'
          DB_NAME_DEV=travelcanvas
          DB_USER=travelcanvas_app
          DB_PASSWORD=ci-only-not-a-real-secret
          DATABASE_URL=postgresql://travelcanvas_app:ci-only-not-a-real-secret@postgres:5432/travelcanvas
          JWT_SECRET_KEY=ci-only-dummy-jwt-secret-not-used-anywhere-else
          ENCRYPTION_KEY=ci-only-dummy-encryption-key-not-used-anywhere-else
          # [Gate M10-R1] document-wallet.spec.ts(FR-013)がCIのPlaywright
          # E2Eに含まれるようになったため、DOCUMENT_DOWNLOAD_SIGNING_KEY
          # 未設定のままだとダウンロードURL発行が503(DownloadSigningNot
          # Configured)になりE2Eが失敗する。このジョブの使い捨てスタックに
          # のみ通用する非秘密な固定値を注入する(本番/開発環境の値とは
          # 一切関係が無い)。
          DOCUMENT_DOWNLOAD_SIGNING_KEY=ci-only-dummy-download-signing-key-not-used-anywhere-else
          # [Gate S11] 予約番号の盲検索(R3-13)。omega-dev2 の .env と同じく設定する(未設定だと予約の検索が 503)
          LOOKUP_INDEX_KEY=ci-only-dummy-lookup-index-key-not-used-anywhere-else
          # [Gate G2] SEC-F4 backend は表の読み書きだけのロール(tc_app)で接続する。migrate サービスがロールを作る
          DB_APP_PASSWORD=ci-only-dummy-app-role-password-0123456789
          APP_DATABASE_URL=postgresql://tc_app:ci-only-dummy-app-role-password-0123456789@postgres:5432/travelcanvas
          VITE_API_URL=http://localhost:8001
          EOF

      - name: Build & start full stack (postgres/redis/backend/frontend)
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8001/health >/dev/null; then
              echo "backend is healthy"; exit 0
            fi
            sleep 5
          done
          echo "::error::backendが時間内にhealthyになりませんでした"
          docker compose logs backend
          exit 1

      # [Gate G2] SEC-F4 migration は compose の migrate サービス(所有者の資格情報)が backend の起動前に流す。
      # backend は tc_app で接続し、表を作る・変える・消す・migration の版を書き換えることができないことを確かめる
      - name: DB の権限の分離の確認 (ブロッキング)
        run: |
          docker compose logs migrate | tail -5
          docker compose exec -T backend python -m app.ops.db_roles check --expect-app

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 >/dev/null; then
              echo "frontend is up"; exit 0
            fi
            sleep 3
          done
          echo "::error::frontendが時間内に応答しませんでした"
          docker compose logs frontend
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies + Playwright browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright E2E (ブロッキング)
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
          PLAYWRIGHT_JUNIT_OUTPUT: e2e-results/junit.xml
          PLAYWRIGHT_JSON_OUTPUT: e2e-results/report.json
          CI: 'true'
        run: npx playwright test

      # [Gate G11] 429 の連鎖(接続元の点数が CI でだけ遮断に届く)の原因を調べるため、何の応答が点数になったかを要約・注記に残す
      - name: E2E の接続元の点数の報告
        if: always()
        run: docker compose logs -t --no-color backend | python3 scripts/ci/e2e_guard_report.py

      # [Gate G3] CI-04 再試行で通った試験(flaky)を合格とは別に数え、spec ごとに issue へ残す(合格の扱いのまま放置しない)
      - name: E2E の再試行(flaky)の記録
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/e2e_flaky_report.py frontend/e2e-results/report.json --issue

      # [Gate G1] GOV-03 VERIFIED の E2E の証拠(spec ごと)がこの実行で合格したかを照合する
      - name: VERIFIED の E2E の証拠の照合 (ブロッキング)
        run: python3 scripts/ci/check_ledger_results.py e2e --junit frontend/e2e-results/junit.xml

      # [Gate G1] CI-02 E2E の結果(JUnit・HTML の報告)を合否に関わらず残す
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.sha }}
          path: |
            frontend/playwright-report/
            frontend/e2e-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down full stack
        if: always()
        run: docker compose down -v
