# [Gate G3] CI-05 大きいデータの性能の検査(毎晩・手動)。1つの旅行に予定 10,000 件・通知 100,000 件を入れ、主な画面の
# API の p95 が上限以下・SQL の数が件数で増えない(N+1 なし)・主な問い合わせが索引を使えることを確かめ、結果を残す。
# 普段の CI(ci.yml の backend)は小さいデータで同じ N+1・索引の検査を行う(backend/tests/test_gate_g3_perf.py)。
name: perf

on:
  schedule:
    - cron: '17 18 * * *'   # 毎日 03:17 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: travelcanvas_app
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          POSTGRES_DB: travelcanvas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U travelcanvas_app"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://travelcanvas_app:ci-only-not-a-real-secret@localhost:5432/travelcanvas_test
      JWT_SECRET_KEY: ci-only-dummy-jwt-secret-not-used-anywhere-else
      TC_PERF: '1'
      TC_PERF_EVENTS: '10000'
      TC_PERF_RECORDS: '100000'
      TC_PERF_OUT: ../ci-results/perf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc g++ libjpeg-dev libpng-dev libgeos-dev libproj-dev
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt
      - name: Migration
        run: alembic upgrade head
      - name: 性能の検査 (ブロッキング)
        run: python -m pytest tests/test_gate_g3_perf.py -v --junitxml=../ci-results/perf-junit.xml
      - name: 要約
        if: always()
        run: python3 ../scripts/ci/junit_summary.py --title "perf" ../ci-results/perf-junit.xml
      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.sha }}
          path: ci-results/
          retention-days: 90
          if-no-files-found: warn
